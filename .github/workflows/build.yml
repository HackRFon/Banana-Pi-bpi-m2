name: Build BPI-M2 image
on:
  workflow_dispatch:   # lets you start it with a button

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Fix Windows line endings
        run: sed -i 's/\r$//' *.sh
      - name: Build image
        run: sudo bash build-bpi-m2-image.sh
      - name: Upload image
        uses: actions/upload-artifact@v4
        with:
          name: bpi-m2-debian-image
          path: bpi-m2-debian.img.xz
          compression-level: 0
